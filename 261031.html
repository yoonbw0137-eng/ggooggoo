<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>병우❤️지은 신혼여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#18212E; --muted:#5B6878; --line:#D8DFE7;
  --grid:#DFE6ED; --river:#93B9D3; --land:#E4EAF0; --warnbg:#FFF6E0; --warnline:#D9A400; --warnink:#5C4500;
  --swiss:#C8102E; --prague:#93701E; --budapest:#15766A;
  --c-sight:#3D63B8; --c-food:#C25B12; --c-cafe:#9A4E8F; --c-night:#3E4A9E; --c-xmas:#1E7A3C;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161E; --surface:#18212C; --surface2:#1F2936; --ink:#E6ECF2; --muted:#9AA8B9; --line:#2C3847;
    --grid:#1F2B39; --river:#3C6987; --land:#1A2430; --warnbg:#2E2610; --warnline:#C99A1E; --warnink:#F1DCA0;
    --swiss:#F2667A; --prague:#DDB65E; --budapest:#4DB8A6;
    --c-sight:#86A6EE; --c-food:#F0965A; --c-cafe:#D893CE; --c-night:#A3ADF5; --c-xmas:#6CCB8A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161E; --surface:#18212C; --surface2:#1F2936; --ink:#E6ECF2; --muted:#9AA8B9; --line:#2C3847;
  --grid:#1F2B39; --river:#3C6987; --land:#1A2430; --warnbg:#2E2610; --warnline:#C99A1E; --warnink:#F1DCA0;
  --swiss:#F2667A; --prague:#DDB65E; --budapest:#4DB8A6;
  --c-sight:#86A6EE; --c-food:#F0965A; --c-cafe:#D893CE; --c-night:#A3ADF5; --c-xmas:#6CCB8A;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6;--accent:var(--swiss)}
body[data-city="prague"]{--accent:var(--prague)}
body[data-city="budapest"]{--accent:var(--budapest)}
body[data-city="money"],body[data-city="tips"],body[data-city="fav"]{--accent:var(--ink)}
a{color:inherit} button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.serif{font-family:"Gowun Batang",serif}

header.hero{padding:40px 0 8px}
.hero h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(30px,6vw,52px);line-height:1.15;margin:0}
.hero p.lede{margin:12px 0 0;color:var(--muted);max-width:62ch}
.hero .sum{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-size:14px}
.hero .sum b{font-weight:600}
.hero .sum span{color:var(--muted)}
.routecard{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.routemap{display:block;width:100%;height:auto}
.routemap .grat{stroke:var(--grid);stroke-width:1}
.routemap .country{fill:var(--muted);opacity:.55;font-size:15px;letter-spacing:.2em}
.routemap .river{fill:none;stroke:var(--river);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.routemap .riverlabel{fill:var(--river);font-size:13px;font-style:italic}
.routemap .leg{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.routemap .leg.swiss{stroke:var(--swiss)}
.routemap .leg.train{stroke:var(--ink)}
.routemap .leg.flight{stroke:var(--muted);stroke-dasharray:2 9;stroke-width:3}
.routemap .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
.routemap .fade{opacity:0;animation:fade .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes fade{to{opacity:1}}
.routemap .legtag{font-size:13px;fill:var(--muted)}
.routemap .stop{cursor:pointer}
.routemap .stop circle{fill:var(--surface);stroke-width:3.5}
.routemap .stop text{font-size:16px;font-weight:600;fill:var(--ink)}
.routemap .stop:hover circle{r:10}
.routemap .stop:focus{outline:none}
.routemap .stop:focus-visible text{text-decoration:underline}
.legs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.legs button{all:unset;cursor:pointer;padding:14px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.legs button:last-child{border-right:0}
.legs button:hover{background:var(--surface2)}
.legs button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.legs .d{font-size:13px;color:var(--muted)}
.legs .n{font-family:"Gowun Batang",serif;font-size:19px;font-weight:700}
.legs .n i{font-style:normal;font-family:"IBM Plex Sans KR",sans-serif;font-size:13px;font-weight:500;margin-left:6px;padding:1px 8px;border-radius:999px;color:var(--surface)}
.legs [data-go="swiss"] .n i{background:var(--swiss)}
.legs [data-go="prague"] .n i{background:var(--prague)}
.legs [data-go="budapest"] .n i{background:var(--budapest)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:28px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;white-space:nowrap;padding:14px 12px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tab .cnt{font-size:12px;margin-left:4px;color:var(--muted)}

main{padding:28px 0 64px}
.cityhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.cityhead h2{font-family:"Gowun Batang",serif;font-size:clamp(26px,4.5vw,38px);margin:0;line-height:1.2}
.cityhead h2 small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}

.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px}
.day{all:unset;cursor:pointer;flex:0 0 auto;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:128px}
.day .dn{font-weight:600;font-size:14px}
.day .dt{font-size:13px;color:var(--muted)}
.day .dm{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day[aria-pressed="true"] .dn{color:var(--accent)}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.daymap{display:block;width:100%;height:auto;background:var(--land)}
.daymap .g{stroke:var(--grid);stroke-width:1}
.daymap .path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 6;opacity:.7}
.daymap .pin{cursor:pointer}
.daymap .pin circle{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.daymap .pin text{font-size:12px;font-weight:600;fill:var(--accent);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.daymap .pin.on circle{fill:var(--accent);r:15}
.daymap .pin.on text{fill:var(--surface)}
.daymap .pin.dim{opacity:.25}
.daymap .pin:focus{outline:none}
.daymap .pin:focus-visible circle{stroke-width:4}
.daymap .home rect{fill:var(--ink)}
.daymap .home text{fill:var(--surface);font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.mapfoot{padding:14px 18px;border-top:1px solid var(--line)}
.mapfoot p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.mapfoot p b{color:var(--ink);font-weight:600}
.mapfoot .stay{display:flex;gap:10px;align-items:baseline}
.mapfoot .stay .tag{flex:0 0 auto;font-size:12px;font-weight:600;background:var(--ink);color:var(--surface);border-radius:4px;padding:0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--surface);text-decoration:none;font-size:14px;font-weight:600;border:0;cursor:pointer}
.btn:hover{filter:brightness(1.08)}

.budget{padding:16px 18px}
.budget h3{margin:0 0 4px;font-size:16px;font-weight:600}
.budget .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.bitem{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.bitem:first-of-type{border-top:0}
.bitem .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.bitem.opt .lab{color:var(--muted)}
.bitem.opt.on .lab{color:var(--ink)}
.bitem input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.bitem .optl{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap}
.btotal{margin-top:8px;padding-top:10px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.btotal .loc{font-weight:600;font-variant-numeric:tabular-nums}
.btotal .krw{font-family:"Gowun Batang",serif;font-size:20px;font-weight:700}

.warn{background:var(--warnbg);border-left:4px solid var(--warnline);color:var(--warnink);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px;margin-bottom:16px}
.warn b{font-weight:600}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.sight{background:var(--c-sight)}.dot.food{background:var(--c-food)}.dot.cafe{background:var(--c-cafe)}.dot.night{background:var(--c-night)}.dot.xmas{background:var(--c-xmas)}

.list{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:56px 1fr;gap:0 14px;padding:16px 0;border-bottom:1px solid var(--line);scroll-margin-top:140px}
.stop:first-child{padding-top:4px}
.stop .time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.stop .row{display:flex;align-items:flex-start;gap:10px}
.stop .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:2px}
.stop.on .num{background:var(--accent);color:var(--surface)}
.stop h3{margin:0;font-size:17px;font-weight:600;line-height:1.4;flex:1;cursor:pointer}
.stop h3 .optl{font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px;color:var(--muted);vertical-align:2px}
.stop .en{margin:2px 0 6px 34px;font-size:13px;color:var(--muted)}
.stop .cat{margin-left:34px;font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.stop .desc{margin:8px 0 0 34px}
.stop .tip{margin:8px 0 0 34px;font-size:14px;padding:8px 12px;background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
.stop .warn{margin:8px 0 0 34px;padding:8px 12px;border-left-width:3px}
.stop .links{margin:10px 0 0 34px;font-size:14px}
.stop .links a{color:var(--accent);font-weight:500;text-underline-offset:3px}
.stop.hidden{display:none}
.fav{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:0 0 auto;margin-top:-4px}
.fav:hover{background:var(--surface2)}
.fav svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8}
.fav[aria-pressed="true"] svg{fill:var(--swiss);stroke:var(--swiss)}
.fav:focus-visible{outline:2px solid var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.panel h3{font-family:"Gowun Batang",serif;font-size:21px;margin:0 0 14px}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.full{grid-column:1/-1}
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rates label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.rates .inp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2)}
.rates input{border:0;background:transparent;width:100%;font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.rates input:focus{outline:none}
.rates .inp:focus-within{outline:2px solid var(--ink);outline-offset:1px}
.bigtotal{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline;margin-top:18px}
.bigtotal .k{font-family:"Gowun Batang",serif;font-size:clamp(30px,5vw,42px);font-weight:700;line-height:1.1}
.bigtotal .s{color:var(--muted);font-size:14px}
.cur3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.cur3 > div{border:1px solid var(--line);border-radius:14px;padding:14px}
.cur3 .c{font-size:13px;color:var(--muted)}
.cur3 .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.cur3 .w{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-weight:600;background:var(--surface2)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface2)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.advice{margin:0;padding:0;list-style:none}
.advice li{padding:12px 0;border-top:1px solid var(--line)}
.advice li:first-child{border-top:0;padding-top:0}
.advice b{display:block;font-weight:600;margin-bottom:2px}
.advice span{font-size:14px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;counter-reset:leg}
.timeline li{position:relative;padding:0 0 18px 40px;counter-increment:leg}
.timeline li::before{content:counter(leg);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
.timeline li::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline b{display:block;font-weight:600}
.timeline span{font-size:14px;color:var(--muted)}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check small{display:block;color:var(--muted);font-size:13px}
.notice{margin-top:24px;font-size:13px;color:var(--muted)}
.favgroup{margin-bottom:28px}
.favgroup h3{font-family:"Gowun Batang",serif;font-size:22px;margin:0 0 6px}

@media (max-width:860px){
  .grid,.twocol{grid-template-columns:1fr}
  .side{position:static}
  .legs{grid-template-columns:1fr}
  .legs button{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;justify-content:space-between;align-items:center}
  .legs button:last-child{border-bottom:0}
}
@media (max-width:560px){
  .wrap{padding:0 14px}
  header.hero{padding-top:24px}
  .stop{grid-template-columns:1fr}
  .stop .time{padding:0 0 4px 34px}
  .rates,.cur3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .routemap .draw{animation:none;stroke-dashoffset:0}
  .routemap .fade{animation:none;opacity:1}
}
</style>
</head>
<body data-city="swiss">

<header class="hero wrap">
  <h1>병우❤️지은 신혼여행</h1>
  <p class="lede">11월 20일 출국, 13박 15일 신혼여행. 예약하신 숙소를 기준으로 하루 동선을 짜고, 음식과 입장료 같은 현지 지출을 날마다 계산했어요. 금액은 모두 두 사람 기준이에요.</p>
  <div class="sum" id="herosum"></div>
  <div class="routecard">
    <svg class="routemap" id="routemap" viewBox="0 0 940 480" role="img" aria-label="취리히, 인터라켄, 칸더슈테크, 프라하, 부다페스트를 잇는 여행 루트 지도"></svg>
    <div class="legs">
      <button data-go="swiss"><span class="d">11/20–11/26</span><span class="n">스위스<i>6박</i></span></button>
      <button data-go="prague"><span class="d">11/26–11/29</span><span class="n">프라하<i>3박</i></span></button>
      <button data-go="budapest"><span class="d">11/29–12/3</span><span class="n">부다페스트<i>4박</i></span></button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="여행 구간">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>

<main class="wrap" id="main"></main>

<script>
const TYPES = { sight:"명소", food:"식사", cafe:"카페·디저트", night:"야경·전망", xmas:"크리스마스 마켓" };
const CUR = { CHF:"스위스 프랑", CZK:"체코 코루나", HUF:"헝가리 포린트" };
const DEFAULT_RATES = { CHF:1620, CZK:65, HUF:4.3 };

const TRIP = {
  swiss: {
    name:"스위스", sub:"취리히 1박, 인터라켄 3박, 칸더슈테크 2박",
    facts:[["일몰","16:45 무렵"],["통화","CHF"],["교통","스위스 패스로 기차·버스·트램 무료"]],
    days:[

function dayTotal(c,d,includeAllOpt){
  const t={CHF:0,CZK:0,HUF:0};
  TRIP[c].days[d].budget.forEach((b,i)=>{
    const [lab,amt,cur,opt]=b;
    if(opt && !(includeAllOpt || state.opt.has(bid(c,d,i)))) return;
    t[cur]+=amt;
  });
  t.krw = t.CHF*state.rates.CHF + t.CZK*state.rates.CZK + t.HUF*state.rates.HUF;
  return t;
}
function curStr(t){
  return ["CHF","CZK","HUF"].filter(k=>t[k]).map(k=>`${k} ${n0(t[k])}`).join(" + ") || "없음";
}
function grand(){
  const g={CHF:0,CZK:0,HUF:0,krw:0};
  CITIES.forEach(c=>TRIP[c].days.forEach((_,d)=>{ const t=dayTotal(c,d); g.CHF+=t.CHF; g.CZK+=t.CZK; g.HUF+=t.HUF; g.krw+=t.krw; }));
  return g;
}

/* ---------- day map ---------- */
function dayMap(c,d,day){
  const stops=day.stops, W=440, H=300, pad=36;
  const all=[...stops, day.stay];
  const lats=all.map(s=>s.lat), lngs=all.map(s=>s.lng);
  const mid=(Math.min(...lats)+Math.max(...lats))/2, k=Math.cos(mid*Math.PI/180);
  const xs=lngs.map(v=>v*k);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...lats), y1=Math.max(...lats);
  const span=Math.max(x1-x0,y1-y0,0.004);
  const s=Math.min((W-pad*2)/Math.max(x1-x0,span*0.3),(H-pad*2)/Math.max(y1-y0,span*0.3));
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const pt=st=>[W/2+(st.lng*k-cx)*s, H/2-(st.lat-cy)*s];
  let g="";
  for(let i=1;i<6;i++) g+=`<line class="g" x1="${W*i/6}" y1="0" x2="${W*i/6}" y2="${H}"/>`;
  for(let i=1;i<4;i++) g+=`<line class="g" x1="0" y1="${H*i/4}" x2="${W}" y2="${H*i/4}"/>`;
  const pts=stops.map(pt);
  g+=`<polyline class="path" points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}"/>`;
  const [hx,hy]=pt(day.stay);
  g+=`<g class="home" aria-label="숙소"><rect x="${(hx-11).toFixed(1)}" y="${(hy-11).toFixed(1)}" width="22" height="22" rx="4"/><text x="${hx.toFixed(1)}" y="${hy.toFixed(1)}">숙</text></g>`;
  stops.map((st,i)=>({st,i})).reverse().forEach(({st,i})=>{
    const [x,y]=pts[i], id=sid(c,d,i);
    const dim=state.filter!=="all" && st.type!==state.filter;
    g+=`<g class="pin${state.active===id?" on":""}${dim?" dim":""}" data-id="${id}" tabindex="0" role="button" aria-label="${i+1}. ${esc(st.name)}">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}">${i+1}</text></g>`;
  });
  return `<svg class="daymap" viewBox="0 0 ${W} ${H}" role="img" aria-label="${day.date} 동선 지도">${g}</svg>`;
}
function dirLink(day){
  const ll=s=>`${s.lat},${s.lng}`;
  const st=day.stops, w=st.slice(0,-1).map(ll).join("|");
  return `https://www.google.com/maps/dir/?api=1&origin=${ll(day.stay)}&destination=${ll(st[st.length-1])}${w?`&waypoints=${encodeURIComponent(w)}`:""}`;
}

/* ---------- budget panel ---------- */
function budgetPanel(c,d){
  const day=TRIP[c].days[d], t=dayTotal(c,d);
  return `<div class="card budget">
    <h3>${day.date} 예상 지출</h3>
    <p class="sub">2인 기준, 교통편과 숙박 제외. 선택 항목은 체크하면 합계에 들어가요.</p>
    ${day.budget.map((b,i)=>{
      const [lab,amt,cur,opt]=b, id=bid(c,d,i), on=state.opt.has(id);
      return `<div class="bitem${opt?" opt":""}${opt&&on?" on":""}">
        ${opt?`<input type="checkbox" data-opt="${id}" ${on?"checked":""} aria-label="${esc(lab)} 포함">`:`<span></span>`}
        <span class="lab">${esc(lab)}${opt?`<span class="optl">선택</span>`:""}</span>
        <span class="amt">${cur} ${n0(amt)}</span></div>`;
    }).join("")}
    <div class="btotal"><span class="loc">${curStr(t)}</span><span class="krw">약 ${won(t.krw)}</span></div>
  </div>`;
}

/* ---------- stop card ---------- */
function stopCard(c,d,i,st,label){
  const id=sid(c,d,i), fav=state.favs.has(id);
  const hidden=state.filter!=="all" && st.type!==state.filter;
  return `<article class="stop${state.active===id?" on":""}${hidden?" hidden":""}" id="s-${id}" data-id="${id}">
    <div class="time">${label||st.t}</div>
    <div>
      <div class="row"><span class="num">${label?"":i+1}</span>
        <h3 data-pick="${id}">${esc(st.name)}${st.opt?`<span class="optl">선택</span>`:""}</h3>
        <button class="fav" aria-pressed="${fav}" aria-label="${esc(st.name)} 찜하기" data-fav="${id}">${heart}</button></div>
      <p class="en">${esc(st.en)}</p>
      <span class="cat"><span class="dot ${st.type}"></span>${TYPES[st.type]}</span>
      <p class="desc">${esc(st.desc)}</p>
      ${st.tip?`<p class="tip">${esc(st.tip)}</p>`:""}
      ${st.warn?`<p class="warn">${esc(st.warn)}</p>`:""}
      <div class="links"><a href="${gmap(st)}" target="_blank" rel="noopener">구글 지도에서 열기</a></div>
    </div></article>`;
}

/* ---------- views ---------- */
function renderCity(){
  const c=state.city, T=TRIP[c], day=T.days[state.day], stops=day.stops;
  const counts=stops.reduce((m,s)=>(m[s.type]=(m[s.type]||0)+1,m),{});
  return `
  <div class="cityhead">
    <h2>${T.name}<small>${T.sub}</small></h2>
    <div class="facts">${T.facts.map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}</div>
  </div>
  <div class="days" role="group" aria-label="날짜 선택">
    ${T.days.map((dd,i)=>`<button class="day" aria-pressed="${i===state.day}" data-day="${i}"><div class="dn">${dd.date} (${dd.dow})</div><div class="dt">${dd.title}</div><div class="dm">약 ${won(dayTotal(c,i).krw)}</div></button>`).join("")}
  </div>
  <div class="grid">
    <aside class="side">
      <div class="card">
        ${dayMap(c,state.day,day)}
        <div class="mapfoot">
          <p class="stay"><span class="tag">숙</span><span><b>${esc(day.stay.name)}</b> <a href="${gmap(day.stay)}" target="_blank" rel="noopener" style="color:var(--accent)">지도</a></span></p>
          <p>${day.move}</p>
          <a class="btn" href="${dirLink(day)}" target="_blank" rel="noopener">오늘 동선 구글 지도로 보기</a>
        </div>
      </div>
      ${budgetPanel(c,state.day)}
    </aside>
    <section>
      ${day.warn?`<div class="warn">${day.warn}</div>`:""}
      <div class="filters" role="group" aria-label="종류별 보기">
        <button class="chip" aria-pressed="${state.filter==="all"}" data-f="all">전체 ${stops.length}</button>
        ${Object.keys(TYPES).filter(t=>counts[t]).map(t=>`<button class="chip" aria-pressed="${state.filter===t}" data-f="${t}"><span class="dot ${t}"></span>${TYPES[t]} ${counts[t]}</button>`).join("")}
      </div>
      <div class="list">${stops.map((st,i)=>stopCard(c,state.day,i,st)).join("")}</div>
    </section>
  </div>`;
}

function renderMoney(){
  const g=grand(), r=state.rates;
  const allOptOn = CITIES.every(c=>TRIP[c].days.every((dd,d)=>dd.budget.every((b,i)=>!b[3]||state.opt.has(bid(c,d,i)))));
  let rows="";
  CITIES.forEach(c=>{
    const T=TRIP[c]; const sub={CHF:0,CZK:0,HUF:0,krw:0};
    T.days.forEach((dd,d)=>{
      const t=dayTotal(c,d); ["CHF","CZK","HUF","krw"].forEach(k=>sub[k]+=t[k]);
      rows+=`<tr class="clickable" data-goc="${c}" data-god="${d}"><td>${dd.date} (${dd.dow})</td><td>${dd.title}</td><td class="num">${curStr(t)}</td><td class="num">${won(t.krw)}</td></tr>`;
    });
    rows+=`<tr class="sub"><td colspan="2">${T.name} 소계</td><td class="num">${curStr(sub)}</td><td class="num">${won(sub.krw)}</td></tr>`;
  });
  const buf=1.15;
  const cash={CHF:150,CZK:2000,HUF:20000};
  return `
  <div class="cityhead"><h2>예산과 환전<small>음식, 입장료, 현지 교통처럼 아직 결제하지 않은 비용만 모았어요. 2인 기준이에요.</small></h2></div>
  <div class="twocol">
    <div class="panel full">
      <h3>적용 환율</h3>
      <div class="rates">
        ${["CHF","CZK","HUF"].map(k=>`<label>1 ${k} (${CUR[k]}) =<span class="inp"><input type="number" inputmode="decimal" step="any" min="0" value="${r[k]}" data-rate="${k}" aria-label="1 ${k} 원화 환율"><span>원</span></span></label>`).join("")}
      </div>
      <p class="notice" style="margin-top:10px">10월 중순 시세를 바탕으로 넣은 대략적인 값이에요. 환전하실 때 실제 환율로 고치면 모든 금액이 다시 계산돼요.</p>
      <div class="bigtotal"><span class="k">약 ${won(g.krw)}</span><span class="s">전체 현지 지출 예상 (선택 항목은 체크한 것만 포함)</span></div>
      <label class="toggle"><input type="checkbox" id="allopt" ${allOptOn?"checked":""}> 선택 항목(융프라우요흐, 쉴트호른, 크루즈 등) 모두 포함하기</label>
      <div class="cur3">
        ${["CHF","CZK","HUF"].map(k=>`<div><div class="c">${CUR[k]}</div><div class="v">${k} ${n0(g[k])}</div><div class="w">약 ${won(g[k]*r[k])} · 여유분 15% 포함 ${k} ${n0(Math.ceil(g[k]*buf/10)*10)}</div></div>`).join("")}
      </div>
    </div>
    <div class="panel full">
      <h3>날짜별 예상 지출</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>날짜</th><th>일정</th><th class="num">현지 통화</th><th class="num">원화</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="notice" style="margin-top:10px">행을 누르면 그날 일정으로 이동해요. 기념품과 쇼핑은 빠져 있으니 따로 잡아 두세요.</p>
    </div>
    <div class="panel">
      <h3>환전은 이렇게</h3>
      <ul class="advice">
        <li><b>대부분은 트래블카드로</b><span>세 나라 모두 카드 결제가 잘 돼요. 외화 충전식 트래블카드에 통화별로 충전해 두고 결제하는 게 가장 편해요.</span></li>
        <li><b>현금은 조금만</b><span>스위스 CHF ${cash.CHF}, 체코 CZK ${n0(cash.CZK)}, 헝가리 HUF ${n0(cash.HUF)} 정도면 선착장 입장료, 펍, 마켓, 팁에 충분해요.</span></li>
        <li><b>코루나와 포린트는 현지 인출</b><span>국내 환전보다 트래블카드로 현지 은행 ATM에서 뽑는 쪽이 보통 유리해요. 관광지의 유로넷 ATM은 수수료가 커서 피하세요.</span></li>
        <li><b>결제할 땐 현지 통화 선택</b><span>카드 단말기나 ATM이 원화 결제를 권하면 거절하고 현지 통화로 결제하세요.</span></li>
      </ul>
    </div>
    <div class="panel">
      <h3>금액 기준</h3>
      <ul class="advice">
        <li><b>스위스 식사</b><span>점심 1인 CHF 20–30, 저녁 1인 CHF 45–60(음료 포함). 모든 숙소가 조식 포함이라 아침값은 넣지 않았어요.</span></li>
        <li><b>체코·헝가리 식사</b><span>펍 저녁 2인 CZK 900–1,600, 특별 디너 CZK 3,000 안팎. 부다페스트 저녁 2인 HUF 22,000–26,000.</span></li>
        <li><b>스위스 패스 할인</b><span>외시넨제 곤돌라와 쉴트호른 50%, 융프라우요흐는 그린델발트 위 구간 25% 할인으로 계산했어요.</span></li>
        <li><b>세체니 온천</b><span>평일 9시 전 굿모닝 티켓 HUF 10,500 + 캐빈 HUF 1,000 (1인)으로 계산했어요.</span></li>
      </ul>
    </div>
  </div>
  <p class="notice">입장료와 메뉴 가격은 2026년 공개 자료를 바탕으로 한 추정치예요. 실제 금액은 조금씩 다를 수 있어요.</p>`;
}

function renderTips(){
  return `
  <div class="cityhead"><h2>이동과 준비물<small>결제하신 이동편 순서, 11월에 알아 둘 것, 챙길 것</small></h2></div>
  <div class="twocol">
    <div class="panel"><h3>이동 순서</h3><ol class="timeline">${LEGS.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join("")}</ol></div>
    <div class="panel"><h3>11월에 알아 둘 것</h3><ul class="advice">${FACTS.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join("")}</ul></div>
    <div class="panel full"><h3>준비물과 예약 체크리스트 <span style="font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;font-weight:400;color:var(--muted)">${state.pack.size}/${PACK.length}</span></h3>
      ${PACK.map(([a,b],i)=>`<label class="check${state.pack.has(i)?" done":""}"><input type="checkbox" data-pack="${i}" ${state.pack.has(i)?"checked":""}><span>${a}${b?`<small>${b}</small>`:""}</span></label>`).join("")}
    </div>
  </div>
  <p class="notice">영업시간, 운행 일정, 요금은 바뀔 수 있어요. 출발 전 각 장소의 공식 사이트에서 한 번 더 확인하세요.</p>`;
}

function renderFavs(){
  const groups=CITIES.map(c=>{
    const T=TRIP[c], items=[];
    T.days.forEach((dd,d)=>dd.stops.forEach((st,i)=>{ if(state.favs.has(sid(c,d,i))) items.push(stopCard(c,d,i,st,dd.date)); }));
    return items.length?`<div class="favgroup"><h3>${T.name}</h3><div class="list">${items.join("")}</div></div>`:"";
  }).join("");
  return `<div class="cityhead"><h2>찜한 곳<small>왼쪽 날짜는 방문 예정일이에요</small></h2></div>
    ${groups||`<div class="empty">아직 찜한 곳이 없어요. 도시 일정에서 장소 옆 하트를 눌러 담아 보세요.</div>`}`;
}

function render(){
  renderTabs(); renderHeroSum();
  const m=document.getElementById("main");
  if(state.city==="money") m.innerHTML=renderMoney();
  else if(state.city==="tips") m.innerHTML=renderTips();
  else if(state.city==="fav") m.innerHTML=renderFavs();
  else m.innerHTML=renderCity();
  bind();
}

function setActive(id,scroll){
  state.active=state.active===id?null:id;
  document.querySelectorAll(".pin").forEach(p=>p.classList.toggle("on",p.dataset.id===state.active));
  document.querySelectorAll(".stop").forEach(s=>s.classList.toggle("on",s.dataset.id===state.active));
  if(scroll&&state.active){ const el=document.getElementById("s-"+id); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"}); }
}

function bind(){
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ state.day=+b.dataset.day; state.filter="all"; state.active=null; render(); });
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ state.filter=b.dataset.f; render(); });
  document.querySelectorAll(".pin").forEach(p=>{
    p.onclick=()=>setActive(p.dataset.id,true);
    p.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); setActive(p.dataset.id,true); } };
  });
  document.querySelectorAll("[data-pick]").forEach(h=>h.onclick=()=>setActive(h.dataset.pick,false));
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.fav; state.favs.has(id)?state.favs.delete(id):state.favs.add(id);
    store.set("hm2-favs",[...state.favs]);
    if(state.city==="fav") render(); else { b.setAttribute("aria-pressed",state.favs.has(id)); renderTabs(); }
  });
  document.querySelectorAll("[data-opt]").forEach(cb=>cb.onchange=()=>{
    const id=cb.dataset.opt; cb.checked?state.opt.add(id):state.opt.delete(id);
    store.set("hm2-opt",[...state.opt]); render();
  });
  document.querySelectorAll("[data-pack]").forEach(cb=>cb.onchange=()=>{
    const i=+cb.dataset.pack; cb.checked?state.pack.add(i):state.pack.delete(i);
    store.set("hm2-pack",[...state.pack]); render();
  });
  document.querySelectorAll("[data-rate]").forEach(inp=>inp.onchange=()=>{
    const v=parseFloat(inp.value); if(!(v>0)) { inp.value=state.rates[inp.dataset.rate]; return; }
    state.rates[inp.dataset.rate]=v; store.set("hm2-rates",state.rates); render();
  });
  const all=document.getElementById("allopt");
  if(all) all.onchange=()=>{
    CITIES.forEach(c=>TRIP[c].days.forEach((dd,d)=>dd.budget.forEach((b,i)=>{ if(b[3]){ all.checked?state.opt.add(bid(c,d,i)):state.opt.delete(bid(c,d,i)); } })));
    store.set("hm2-opt",[...state.opt]); render();
  };
  document.querySelectorAll("[data-goc]").forEach(tr=>tr.onclick=()=>{ goCity(tr.dataset.goc,+tr.dataset.god); jumpTabs(); });
}

document.querySelectorAll(".legs button").forEach(b=>b.onclick=()=>{ goCity(b.dataset.go,0); jumpTabs(); });
drawRoute();
render();
</script>
</body>
</html>
